name: tests
on: push
jobs:
  run_tests:
    runs-on: ubuntu-latest
    # Cap the job so a full maven.scijava.org outage fails in minutes instead
    # of retrying for ~2 hours (as happened on 2026-08-27).
    timeout-minutes: 40
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      # The ImageJ/SciJava dependencies (scifio, imagej-ops, mines-jtk, ...)
      # are hosted ONLY on maven.scijava.org — they are not on Maven Central,
      # and maven.imagej.net is the same server. So there is no alternative
      # repository to point at; instead we cache ~/.m2/repository. Once a green
      # run populates it, later runs restore the jars and do not need scijava at
      # all for unchanged dependencies. restore-keys falls back to the newest
      # cache even when pom.xml (and thus the exact key) changes.
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # Retry the build a few times to ride out brief scijava 503s; the
      # retryHandler flags also retry individual transient artifact transfers.
      #
      # enforcer.skip=true: the pom-scijava parent runs the extra-enforcer
      # BanDuplicateClasses rule, which re-resolves scijava-only artifacts
      # (imglib2, scifio, imagej-*). With the restored ~/.m2 cache those jars
      # are present but their resolution is re-verified against Maven Central
      # only, where they do not exist, so the rule aborts with "present, but
      # unavailable" (a cached 404) — an infra/cache artifact, NOT a real
      # duplicate-class problem. Compile + the JUnit suite still run. Duplicate
      # classes are separately mitigated by the shade include-list in pom.xml;
      # do a clean-checkout enforcer run when you want to re-verify that.
      - name: Run tests with Maven
        run: |
          for attempt in 1 2 3; do
            echo "::group::Maven attempt $attempt"
            mvn -B -ntp test --file pom.xml \
              -Denforcer.skip=true \
              -Daether.connector.http.retryHandler.count=5 \
              -Dmaven.wagon.http.retryHandler.count=5 \
              && { echo "::endgroup::"; exit 0; }
            echo "::endgroup::"
            echo "Attempt $attempt failed (possibly a transient scijava 503); retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          echo "All Maven attempts failed"
          exit 1
